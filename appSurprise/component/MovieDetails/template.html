<section class="movieDetails">
  <figure class="movie__details">
    <iframe
      src="{{movieTrailer}}&autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&cc_load_policy=0"
      frameborder="0"
      class="detail__trailer"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      allowfullscreen
    ></iframe>
    <div class="trailer__overlay"></div>
    <div class="movie__first">
      <a href="#" class="movie__watch">
        <svg class="icone">
          <use xlink:href="#playBtn"></use>
        </svg>
        Regarder
      </a>
      <div class="movie__small">
        <div class="small__infos">
          <p class="small__info">{{movieCategory}}</p>
          •
          <p class="small__info">{{movieYear}}</p>
          •
          <p class="small__info">{{movieLength}} minutes</p>
          •
          <p class="small__info">-{{movieRestriction}} ans</p>
        </div>
        <p class="context__infos">
          {{movieTitle}} • Réalisé par {{movieDirector}}
        </p>
      </div>
      <div class="movie__btns">
        <div class="myfavorite">
          <span onclick="{{favBtn}}" class="myfavorite__btn">
            <svg class="icone">
              <use xlink:href="#add"></use>
            </svg>
          </span>
          <p class="myfavorite__name">Ma liste</p>
        </div>
      </div>
    </div>
    <figcaption class="details">
      <h2 class="infos">Informations</h2>
      <div class="small__details">
        <p class="detail__desc">{{movieDescription}}</p>
        <div class="more">
          <h3 class="more__title">Langues et sous-titres</h3>
          <div class="more__details">
            <p class="text__details small__detail">VF</p>
            <p class="text__details small__detail">VOST</p>
            <svg class="icone small__detail icone__ad">
              <use xlink:href="#audiodesc"></use>
            </svg>
            <svg class="icone small__detail icone__deaf">
              <use xlink:href="#deaf"></use>
            </svg>
          </div>
        </div>
      </div>
    </figcaption>
  </figure>
</section>
