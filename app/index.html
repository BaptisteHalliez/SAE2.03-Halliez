<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
  </head>

  <body>
    <header id="header"></header>

    <section id="content"></section>

    <script type="module">
      import { NavBar } from "./component/NavBar/script.js";
      import { DataMovie } from "./data/dataMovie.js";
      import { DataProfile } from "./data/dataProfile.js";
      import { Movie } from "./component/Movie/script.js";
      import { MovieDetails } from "./component/MovieDetails/script.js";
      import { MovieCategory } from "./component/MovieCategory/script.js";

      let movies = await DataMovie.requestMovies(0);
      let profiles = await DataProfile.read();

      // Controleur
      // Rappel, écrire window.C plutôt que let C est nécessaire pour tester depuis la console du navigateur
      // Une fois l'application terminée, on pourrait remettre let C.
      window.C = {};

      C.handlerHome = function () {
        V.renderMovieCategory(movies, "C.handlerMovieDetail()");
        C.handlerSelectedProfiles();
      }

      C.handlerDeconnexion = function (){
            document.querySelector('#content').innerHTML = "<p class='profile__disconnected'>Veuillez vous connecter pour voir les films</p>"
            return;
        }

      C.handlerMovieDetail = async function(id){
        let data = await DataMovie.requestMovieDetails(id);
        V.renderMovieDetails(data);
      }
      
      C.handlerSelectedProfiles = async function () {
        let selectProfile = document.querySelector(".profile");
        let content = document.querySelector('#content');

        let selectProfileMenu = selectProfile.value;

        if (!selectProfileMenu) {
          content.innerHTML = `<h2 class="profile__disconnected">Veuillez sélectionner un profil</h2>`
          return;
        }

        let profileSelected = profiles.find(p => p.id == selectProfileMenu);
        let data = await DataMovie.requestMovies(profileSelected.min_age);
        V.renderMovieCategory(data, "C.handlerMovieDetail()")
      }

      C.start = function () {
        V.renderNavBar("C.handlerHome()", "C.handlerSelectedProfiles()", profiles, "C.handlerDeconnexion()");
        V.renderMovieCategory(movies);
        C.handlerSelectedProfiles();
      }

      // Vue (contient tout ce qui est relatif à l'affichage)
      window.V = {};

      /**
       * V.renderNavBar
       *
       * Cette fonction est responsable de l'affichage de la barre de navigation (NavBar).
       * Elle sélectionne l'élément HTML avec l'ID "header" et y insère le contenu
       * formaté par le composant NavBar.
       */
      V.renderNavBar = function (hHome, hProfiles, profile, hDeconnexion) {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(hHome, hProfiles, profile, hDeconnexion);
      };


      V.renderMovie = function (data){
        let content = document.querySelector('#content');
        content.innerHTML = Movie.format(data);
      }

      V.renderMovieDetails = function (data){
        let content = document.querySelector('#content');
        content.innerHTML = MovieDetails.format(data);
      }

      V.renderMovieCategory = function (category){
        let content = document.querySelector('#content');
        let moviesHTML = "";

        for (let categoryName in category){
          let categoryMovie = category[categoryName];
          moviesHTML += MovieCategory.format(categoryName, categoryMovie);
        }

        if (moviesHTML === ""){
          content.innerHTML = 
          `<p class="movie__empty">Aucun film disponible pour cette tranche d'âge</p>`
        }
        else {
          content.innerHTML = moviesHTML;
        }
      }

      C.start(); // Démarre l'application
    </script>
  </body>
</html>
<script type="module"></script>
