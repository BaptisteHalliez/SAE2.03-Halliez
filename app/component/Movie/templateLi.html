<li onclick="C.handlerMovieDetail('{{movieId}}')" class="movie__item">
    <figure class="card">
      <div class="card__img-container">
        <img src="{{sourceAffiche}}" alt="affiche-film" class="card__img" />
      </div>
      <figcaption class="card__infos">
        <p class="card__title">{{movieTitle}}</p>
      </figcaption>
    </figure>
</li>
