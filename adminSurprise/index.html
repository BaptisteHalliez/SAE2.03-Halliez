<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 ADMIN</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
  </head>
  <body>
    <section id="log"></section>
    <section id="addMovie"></section>
    <section id="addProfile"></section>

    <script type="module">
      import { Log } from "./component/Log/script.js";
      import { DataMovie } from "./data/dataMovie.js";
      import { DataProfile } from "./data/dataProfile.js";
      import { AddMovieForm } from "./component/AddMovieForm/script.js";
      import { AddProfileForm } from "./component/ProfileForm/script.js";

      let Category = await DataMovie.requestCategories();

      window.C = {};

      C.handlerAddMovie = async function(){
        // Sélectionne l'élément possédant la classe '.addmovie__form'
        let form = document.querySelector('.addmovie__form');
        if (form.reportValidity()){
          let fd = new FormData(form);
          let res = await DataMovie.add(fd);
          V.renderLog(res);
        }
      }

      C.handlerAddProfile = async function(){
        // Sélectionne l'élément possédant la classe '.addprofile__form'
        let form = document.querySelector('.addprofile__form');
        if (form.reportValidity()){
          let fd = new FormData(form);
          console.log("ID envoyé au serveur :", fd.get("id"));
          let res = await DataProfile.add(fd);
          V.renderLog(res);
        }
      }

      C.handlerSelectProfile = async function(id){
        let p = DataProfile.getProfileId(id);
        
        if (p) {
            document.querySelector('#profile_name').value = p.nom;
            document.querySelector('#profile_avatar').value = p.avatar;
            document.querySelector('#profile_age').value = p.min_age;
        } else {
            document.querySelector('#profile_form').reset();
        }
      }

      C.start = async function () {
        let profiles = await DataProfile.read();
        V.renderLog("Démarrage de l'application");
        V.renderMovie("C.handlerAddMovie()");
        V.renderProfile("C.handlerAddProfile()", profiles);
      };

      window.V = {};

      V.renderLog = function (txt) {
        let content = document.querySelector("#log");
        content.innerHTML = Log.format(txt);
      };

      V.renderMovie = function(handler){
        let content = document.querySelector('#addMovie');
        content.innerHTML = AddMovieForm.format(Category, handler);
      }

      V.renderProfile = function(handler, profiles){
        let content = document.querySelector('#addProfile');
        content.innerHTML = AddProfileForm.format(handler, profiles);
      }

      C.start();
    </script>
  </body>
</html>
